/**:
    ros__parameters:
        dataset:
            name: "BOREAS-RT"
        common:
            lid_topic: "/velodyne_points"
            imu_topic: "/imu/data"
            lid_frame_id: "lidar"
            imu_frame_id: "imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 2
            scan_line: 128
            blind: 2.0
            timestamp_unit: 0
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            init_gyro_bias_from_mean: false
            init_gravity_from_mean_acc: false
            fov_degree: 360.0
            det_range: 200.0
            extrinsic_est_en: false
            extrinsic_T: [0.000000000, 0.000000000, 0.130000000]
            extrinsic_R: [0.736055565, -0.676921122, 0.000000000,
                          0.676921122,  0.736055565, 0.000000000,
                          0.000000000,  0.000000000, 1.000000000]

        publish:
            path_en: true
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false
            map_publish_en: true
            map_publish_period_sec: 3.0
            map_visual_voxel_size: 0.75
            map_visual_max_points: 250000

        map_file_path: "/home/yoon/FAST_LIO_ROS2/ros2_ws_from_container/src/FAST_LIO/PCD/result.pcd"
        pcd_save:
            pcd_save_en: false
            interval: -1

        traj_save:
            traj_save_en: false
            traj_file_path: "/home/yoon/FAST_LIO_ROS2/ros2_ws_from_container/src/FAST_LIO/traj/trajectory.txt"

        rank_weight:
            enable: false
            gpu_enable: true
            ring_source: "pointcloud2_ring"
            ring_valid_warning_ratio: 0.90
            horizontal_resolution_deg: 0.2
            sigma_r: 1.0
            min_weight: 0.5
            max_weight: 1.2
            huber_enable: false
            huber_delta: 0.2
            map_filter_enable: true
            map_filter_percent: 10.0
            fov_up_deg: 15.0
            fov_down_deg: -25.0
            frame_confidence_enable: false
            frame_alpha_rank: 0.5
            frame_alpha_count: 0.3
            frame_alpha_residual: 0.2
            frame_gamma: 2.0
            frame_ref_points: 1000.0
            frame_residual_sigma: 0.1
            frame_ref_mean: 1.5
            log_every_n_frames: 20

        adaptive_lidar_cov:
            enable: false
            mode: "degradation"
            base_cov: 0.001
            min_confidence: 0.10
            degradation_gamma: 4.0
            min_cov: 0.001
            max_cov: 0.10

        map_confidence_fail_safe:
            enable: true
            min_effective_points: 100
            skip_below_effective_points: 20
            min_rank_valid_ratio: 0.20
            threshold_relax_factor: 0.50

        experiment_log:
            enable: true
            path: "/home/yoon/FAST_LIO_ROS2/ros2_ws_from_container/src/FAST_LIO/Log/weather_adaptive_metrics.csv"

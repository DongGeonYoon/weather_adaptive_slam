/**:
    ros__parameters:
        common:
            lid_topic: "/points_raw"
            imu_topic: "/imu_raw"
            lid_frame_id: "velodyne"
            imu_frame_id: "imu_link"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0
            lidar_qos_depth: 50
            imu_qos_depth: 5000
            # rosbag2 publishes these recorded KITTI topics with RELIABLE QoS.
            # Keep this true for offline bags; live sensors may require false.
            lidar_qos_reliable: true
            imu_qos_reliable: true
            executor_threads: 4

        preprocess:
            lidar_type: 2
            scan_line: 64
            blind: 2.0
            timestamp_unit: 0
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 200.0
            extrinsic_est_en: false

            # KITTI-360: Velodyne -> pose/IMU-like frame
            extrinsic_T: [-0.76500707, 0.30298405, -0.83920367]
            extrinsic_R: [
                0.99992906,  0.00580536,  0.01040029,
                0.00577430, -0.99997879,  0.00301357,
                0.01041756, -0.00295331, -0.99994137
            ]

        dataset:
            name: "KITTI360"

        rank_weight:
            enable: false
            map_filter_enable: false
            gpu_enable: false
            ring_source: "elevation"
            horizontal_resolution_deg: 0.2
            fov_up_deg: 2.0
            fov_down_deg: -24.8

        adaptive_lidar_cov:
            enable: false

        map_confidence_fail_safe:
            enable: true

        publish:
            path_en: true
            scan_publish_en: true
            dense_publish_en: true
            scan_bodyframe_pub_en: true
            map_publish_en: true
            map_publish_period_sec: 3.0
            map_visual_voxel_size: 0.75
            map_visual_max_points: 250000

        map_file_path: "/home/yoon/datasets/KITTI-360/result.pcd"

        pcd_save:
            pcd_save_en: false
            interval: -1

        traj_save:
            traj_save_en: false
            traj_file_path: "/home/yoon/datasets/KITTI-360/trajectory.txt"

        experiment_log:
            enable: true
            path: "/home/yoon/datasets/KITTI-360/weather_adaptive_metrics.csv"
